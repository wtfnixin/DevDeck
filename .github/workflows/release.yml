name: CI/CD Build & Auto-Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Triggers on release tags like v1.0.0

jobs:
  # Job 1: Build the Flutter Android Client
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Run Flutter Analyzer (Linter)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter Tests
        run: flutter test

      - name: Build Release APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DevDeck.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdeck-android-apk
          path: build/app/outputs/flutter-apk/DevDeck.apk

  # Job 2: Build the Windows Desktop Agent
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop-agent/package-lock.json

      - name: Install Agent Dependencies
        working-directory: desktop-agent
        run: npm ci

      - name: Compile TypeScript Agent
        working-directory: desktop-agent
        run: npm run build

      - name: Compile Native Utilities & Helpers
        run: |
          New-Item -ItemType Directory -Force -Path desktop-agent/build
          New-Item -ItemType Directory -Force -Path desktop-agent/bin
          $csc = (Get-ChildItem -Path "C:\Windows\Microsoft.NET\Framework64\v4*" -Filter "csc.exe" -Recurse | Select-Object -First 1).FullName
          Write-Host "Using C# Compiler: $csc"

          # 1. Keypresser Utility
          $srcKeypresser = Join-Path $PWD "desktop-agent\src\utils\keypresser.cs"
          $outKeypresser = Join-Path $PWD "desktop-agent\build\keypresser.exe"
          if (Test-Path $srcKeypresser) {
            & $csc "/target:winexe" "/out:$outKeypresser" "$srcKeypresser"
          }
          if (-not (Test-Path $outKeypresser) -and (Test-Path "desktop-agent\bin\keypresser.exe")) {
            Copy-Item "desktop-agent\bin\keypresser.exe" $outKeypresser -Force
          }
          Copy-Item $outKeypresser "desktop-agent\bin\keypresser.exe" -Force

          # 2. Window Focus Helper
          $srcWindowFocus = Join-Path $PWD "desktop-agent\src\utils\native\WindowFocus.cs"
          $outWindowFocus = Join-Path $PWD "desktop-agent\build\window-focus.exe"
          if (Test-Path $srcWindowFocus) {
            & $csc "/target:winexe" "/out:$outWindowFocus" "$srcWindowFocus"
          }
          if (-not (Test-Path $outWindowFocus) -and (Test-Path "desktop-agent\bin\window-focus.exe")) {
            Copy-Item "desktop-agent\bin\window-focus.exe" $outWindowFocus -Force
          }
          Copy-Item $outWindowFocus "desktop-agent\bin\window-focus.exe" -Force

          # 3. Brightness Control Helper
          $srcBrightness = Join-Path $PWD "desktop-agent\src\utils\native\BrightnessControl.cs"
          $outBrightness = Join-Path $PWD "desktop-agent\build\brightness-control.exe"
          if (Test-Path $srcBrightness) {
            & $csc "/target:winexe" "/r:System.Management.dll" "/out:$outBrightness" "$srcBrightness"
          }
          if (-not (Test-Path $outBrightness) -and (Test-Path "desktop-agent\bin\brightness-control.exe")) {
            Copy-Item "desktop-agent\bin\brightness-control.exe" $outBrightness -Force
          }
          Copy-Item $outBrightness "desktop-agent\bin\brightness-control.exe" -Force

          # 4. Desktop Switcher Helper
          $srcDesktopSwitch = Join-Path $PWD "desktop-agent\src\utils\native\DesktopSwitcher.cs"
          $outDesktopSwitch = Join-Path $PWD "desktop-agent\build\desktop-switcher.exe"
          if (Test-Path $srcDesktopSwitch) {
            & $csc "/target:winexe" "/out:$outDesktopSwitch" "$srcDesktopSwitch"
          }
          if (-not (Test-Path $outDesktopSwitch) -and (Test-Path "desktop-agent\bin\desktop-switcher.exe")) {
            Copy-Item "desktop-agent\bin\desktop-switcher.exe" $outDesktopSwitch -Force
          }
          Copy-Item $outDesktopSwitch "desktop-agent\bin\desktop-switcher.exe" -Force

      - name: Set Release Version in package.json
        working-directory: desktop-agent
        run: npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version

      - name: Build Electron GUI & Setup Installer
        working-directory: desktop-agent
        run: node build-exe.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: 1.0.${{ github.run_number }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Upload Windows Assets
        uses: actions/upload-artifact@v4
        with:
          name: devdeck-windows-agent
          path: |
            desktop-agent/build/devdeck-agent.exe
            desktop-agent/build/DevDeckAgentSetup.exe
            desktop-agent/build/latest.yml

  # Job 3: Create GitHub Release and Upload Binaries
  create-release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: devdeck-android-apk
          path: ./release-assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: devdeck-windows-agent
          path: ./release-assets

      - name: Generate Automatic Release Tag
        id: tag
        run: |
          echo "tag_name=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "release_title=Release v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.release_title }}
          draft: false
          prerelease: false
          files: |
            ./release-assets/DevDeck.apk
            ./release-assets/devdeck-agent.exe
            ./release-assets/DevDeckAgentSetup.exe
            ./release-assets/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
